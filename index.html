  <!-- Anti-FOUC Theme Script -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) {
          var s = localStorage.getItem('finanzapp:settings:v1');
          if (s) {
            var p = JSON.parse(s);
            if (p && p.theme) t = p.theme;
          }
        }
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.backgroundColor = '#faf4ed';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#191724';
        }
      } catch (e) {}
    })();
  </script>
