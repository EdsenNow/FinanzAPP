<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://finanzapp-fb.web.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FinanzApp" />
  <meta property="og:title" content="FinanzApp - Gestión de Finanzas Personales" />
  <meta property="og:description" content="Gestiona tus finanzas personales de forma fácil y eficiente." />
  <meta property="og:url" content="https://finanzapp-fb.web.app/" />
  <meta property="og:image" content="https://finanzapp-fb.web.app/Icons/android-chrome-512x512.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FinanzApp - Gestión de Finanzas Personales" />
  <meta name="twitter:description" content="Gestiona tus finanzas personales de forma fácil y eficiente." />
  <meta name="twitter:image" content="https://finanzapp-fb.web.app/Icons/android-chrome-512x512.png" />

  <meta name="theme-color" content="#6C63FF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinanzApp" />
  
  <title>FinanzApp - Gestión de Finanzas Personales</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-72x72.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  
  <script>
    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js');
      });
    }

    // Redirección
    (function(){
      try{
        if (localStorage.getItem('loggedIn')) {
          window.location.replace('pages/Dashboard/Dashboard.html');
        } else {
          window.location.replace('pages/Login/Login.html');
        }
      } catch(e){
        window.location.replace('pages/Login/Login.html');
      }
    })();
  </script>
  <noscript>
    Si no redirige automáticamente, abre <a href="pages/Login/Login.html">Login</a> o <a href="pages/Dashboard/Dashboard.html">Dashboard</a> si ya iniciaste sesión.
  </noscript>
</head>
<body></body>
</html>
